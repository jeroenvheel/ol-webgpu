<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Memory of a big layer per release of ol-webgpu</title>
<desc id="d">Megabytes of JavaScript heap that a layer of 300 000 points, 200 000 lines and 50 000 polygons adds to its features, as ol/Feature and as RenderFeatures, on WebGL2 and WebGPU, for releases 0.1.0-beta.0 to beta.14, with ol's WebGLVector layer as a reference. The numbers are in bench/history.json.</desc>

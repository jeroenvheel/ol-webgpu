<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Memory of a big layer per release of ol-webgpu</title>
<desc id="d">Megabytes of JavaScript heap that a layer of 300 000 points, 200 000 lines and 50 000 polygons adds to its features, on WebGL2 and WebGPU, for releases 0.1.0-beta.0 to beta.14, with ol's WebGLVector layer as a reference. The numbers are in bench/history.json.</desc>
<style>
  .surface { fill: #ffffff; }
  .primary { fill: #191919; }
  .secondary { fill: #666666; }
  .grid { stroke: #e8e8e8; stroke-width: 1; }
  .ref { stroke: #9c9c9c; stroke-width: 1; }
  .s1 { stroke: #257de0; } .s1f { fill: #257de0; }
  .s2 { stroke: #f47230; } .s2f { fill: #f47230; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: #ffffff; stroke-width: 2; }
  text { font-size: 12px; }
  .title { font-size: 16px; font-weight: 600; }
  .panel { font-size: 13px; font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #191919; }
    .primary { fill: #efefef; }
    .secondary { fill: #9c9c9c; }
    .grid { stroke: #2e2e2e; }
    .ref { stroke: #6e6e6e; }
    .s1 { stroke: #338ced; } .s1f { fill: #338ced; }
    .s2 { stroke: #e76624; } .s2f { fill: #e76624; }
    .dot { stroke: #191919; }

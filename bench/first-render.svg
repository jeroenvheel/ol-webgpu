<title id="t">Time to first render per release of ol-webgpu</title>
<desc id="d">Milliseconds from adding a layer to rendercomplete, for 1M points, 200k lines and 100k polygons, on WebGL2 and WebGPU, for releases 0.1.0-beta.0 to beta.14, with ol's WebGLVector layer as a reference. The numbers are in bench/history.json.</desc>

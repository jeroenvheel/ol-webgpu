  text { font-size: 12px; }
  .title { font-size: 16px; font-weight: 600; }
  .panel { font-size: 13px; font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #191919; }
    .primary { fill: #efefef; }
    .secondary { fill: #9c9c9c; }

[package]
name = "ol_gpu_core"
version = "0.1.0"
edition = "2024"
description = "Geometry tessellation and spatial index for ol-webgpu, compiled to WebAssembly"
license = "BSD-2-Clause"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
earcut = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

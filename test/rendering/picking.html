<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ol-gpu picking</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #map {
        width: 256px;
        height: 256px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import {liveRenderers} from '../../src/renderer/BaseGpuVectorRenderer.ts';
      window.__olgpuSettled = () => [...liveRenderers].every((r) => r.ready && r.framesSinceReady >= 1);
      import('./picking.ts');
    </script>
  </body>
</html>
